# Sentinel AI tool integration matrix
# "available" means a package may be installable, not that Sentinel has an execution adapter.
# Keep UI status separate from installation status and adapter status.
# No entry is considered integrated unless installation and an execution adapter are verified.

- name: Nmap
  id: nmap
  execution: worker
  android: limited
  installation: on-demand-termux-package
  adapter: bounded-tcp-scan
  dashboard: command-output-capture-pending-device-test
- name: Masscan
  id: masscan
  execution: worker
  android: unsupported-raw-packets
  installation: not-integrated-raw-socket-and-root-constraints\n  adapter: none
