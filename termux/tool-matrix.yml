# Sentinel AI tool integration matrix
# "available" means a package may be installable, not that Sentinel has an execution adapter.
# Keep UI status separate from installation status and adapter status.

- name: Nmap
  id: nmap
  execution: worker
  android: limited
  adapter: bounded-tcp-scan
- name: Masscan
  id: masscan
  execution: worker
  android: unsupported-raw-packets
  adapter: none
