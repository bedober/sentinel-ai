name: Sentinel AI CI and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313"
      - name: Build Android PRoot runtime from pinned upstream sources
        run: |
          set -euxo pipefail
          git clone https://github.com/green-green-avk/build-proot-android.git /tmp/proot-builder
          git -C /tmp/proot-builder checkout 01f83b8841358450c78333d1b33ab30d4943bec4
          cd /tmp/proot-builder
          sed -i "s|^ARCHS=.*|ARCHS='aarch64'|" config
          sed -i "s|^NDK=.*|NDK=\"$ANDROID_HOME/ndk/23.2.8568313\"|" config
          ./build.sh
          mkdir -p /tmp/proot-package android-placeholder
          tar -xzf packages/proot-android-aarch64.tar.gz -C /tmp/proot-package
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root"
          cp -a /tmp/proot-package/root/. "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root/"
          mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/assets/licenses"
          cp LICENSE "$GITHUB_WORKSPACE/android/app/src/main/assets/licenses/PRoot-Android-builder-MIT.txt"
          find build -type f \( -name COPYING -o -iname 'LICENSE*' \) -exec cp --parents {} "$GITHUB_WORKSPACE/android/app/src/main/assets/licenses/" \;
          test -x "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root/bin/proot"
          test -d "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root/libexec/proot"
          find "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root" -type f -exec chmod 644 {} \;
          chmod 755 "$GITHUB_WORKSPACE/android/app/src/main/assets/proot/root/bin/proot"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
