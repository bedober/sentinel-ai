name: Sentinel AI CI and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests

  linux-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt pytest
      - run: PYTHONPATH=worker pytest -q worker/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313"
      - name: Build bundled Android PRoot runtime
        run: |
          set -euxo pipefail
          git clone https://github.com/green-green-avk/build-proot-android.git "$GITHUB_WORKSPACE/proot-builder"
          git -C "$GITHUB_WORKSPACE/proot-builder" checkout 01f83b8841358450c78333d1b33ab30d4943bec4
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$ANDROID_HOME:$ANDROID_HOME" \
            -e ANDROID_HOME="$ANDROID_HOME" \
            -w /work/proot-builder ubuntu:20.04 \
            bash /work/scripts/build-proot-runtime.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify embedded runtime is inside APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/proot/root/bin/proot'
          unzip -l "$APK" | grep -q 'assets/proot/root/libexec/proot'
          unzip -l "$APK" | grep -q 'assets/licenses/PRoot-0.15-source.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-standalone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
