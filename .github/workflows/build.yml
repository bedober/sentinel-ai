name: Sentinel AI CI and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests

  linux-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt pytest
      - run: PYTHONPATH=worker pytest -q worker/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and Termux NDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Validate fork build script
        run: bash -n scripts/build-termux-fork.sh
      - name: Build full standalone Termux application fork
        env:
          SENTINEL_TERMUX_APK_OUTPUT: ${{ github.workspace }}/sentinel-ai-termux-fork-debug.apk
        run: bash scripts/build-termux-fork.sh "$RUNNER_TEMP/termux-fork"
      - name: Verify standalone fork package and branding
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/sentinel-ai-termux-fork-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.termux'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'Sentinel AI'"
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-full-termux-fork-debug-apk
          path: sentinel-ai-termux-fork-debug.apk
          if-no-files-found: error
          retention-days: 14
