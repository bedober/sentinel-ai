name: Sentinel AI CI and Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313"
      - name: Build Android PRoot runtime from pinned upstream sources
        run: |
          set -euxo pipefail
          git clone https://github.com/green-green-avk/build-proot-android.git "$GITHUB_WORKSPACE/proot-builder"
          git -C "$GITHUB_WORKSPACE/proot-builder" checkout 01f83b8841358450c78333d1b33ab30d4943bec4
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$ANDROID_HOME:$ANDROID_HOME" \
            -e ANDROID_HOME="$ANDROID_HOME" \
            -w /work/proot-builder ubuntu:20.04 bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python2.7 make gcc wget tar gzip ca-certificates
              ln -sf /usr/bin/python2.7 /usr/local/bin/python
              sed -i "s|^ARCHS=.*|ARCHS=\"aarch64\"|" config
              sed -i "s|^NDK=.*|NDK=\"$ANDROID_HOME/ndk/23.2.8568313\"|" config
              ./build.sh
              mkdir -p /tmp/proot-package
              tar -xzf packages/proot-android-aarch64.tar.gz -C /tmp/proot-package
              mkdir -p /work/android/app/src/main/assets/proot/root
              cp -a /tmp/proot-package/root/. /work/android/app/src/main/assets/proot/root/
              mkdir -p /work/android/app/src/main/assets/licenses
              cp LICENSE /work/android/app/src/main/assets/licenses/PRoot-Android-builder-MIT.txt
              find build -type f \( -name COPYING -o -iname "LICENSE*" \) -exec cp --parents {} /work/android/app/src/main/assets/licenses/ \;
              test -x /work/android/app/src/main/assets/proot/root/bin/proot
              test -d /work/android/app/src/main/assets/proot/root/libexec/proot
              find /work/android/app/src/main/assets/proot/root -type f -exec chmod 644 {} \;
              chmod 755 /work/android/app/src/main/assets/proot/root/bin/proot
            '
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
